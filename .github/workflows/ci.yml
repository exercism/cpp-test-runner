name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # 2.3.5

      - name: Run Tests in Docker
        run: bin/run-tests-in-docker.sh

  # The same suite, run the way a student's browser runs it. The workflow is
  # written to move to exercism/github-actions; this line then becomes
  #   uses: exercism/github-actions/.github/workflows/clientside-test.yml@main
  clientside:
    uses: ./.github/workflows/clientside-test.yml
