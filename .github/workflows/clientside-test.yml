# Runs a track's test-runner suite inside the wasm kernel, on the kernel and
# sysroot its clientside.json names: the track's bin/run.sh, driven by its own
# bin/run-tests.sh, in headless Chromium. It is the browser equivalent of
# `bin/run-tests-in-docker.sh`, and what's under test is the tarball
# publish-clientside.yml would ship, down to the parser being built the same
# way. publish-clientside.yml runs this suite again against the exact bytes it
# publishes.
#
# Copied from jq-test-runner, where it is written as the reusable workflow it
# will become in exercism/github-actions. The one C++-specific addition is
# "Build exercism_parser": the parser is compiled, so it has to be built for
# the kernel before there is a tarball to test.
name: Client-side tests

on:
  workflow_call:

jobs:
  test:
    name: Tests (client-side)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Once this workflow lives in exercism/github-actions, this becomes a
      # sparse checkout of that repo's clientside/ into harness/. Today the
      # harness is beside this file.
      - name: Get the harness
        run: cp -r .github/clientside harness

      - name: Read clientside.json
        id: config
        run: |
          track="${GITHUB_REPOSITORY##*/}"
          track="${track%-test-runner}"
          kernel="$(jq -er '.kernel' clientside.json)"
          version="$(jq -er '.sysroot.version' clientside.json)"
          id="$(jq -er '.sysroot.id' clientside.json)"
          {
            echo "kernel=kernel/${kernel}"
            echo "sysroot=sysroot/${track}/${version}/${id}"
          } >> "$GITHUB_OUTPUT"

      # From where the website serves them, so what's tested is exactly what
      # students get. Nothing here is published until the track points at it,
      # so a PR naming an unpublished kernel or sysroot fails right here.
      # --compressed: they are stored brotli-encoded, and what lands on disk has
      # to be the decoded bytes, as in a browser.
      - name: Fetch the kernel and sysroot
        run: |
          base="https://exercism.org/test-runners"
          fetch() {
            mkdir -p "$(dirname "$1")"
            curl --fail --silent --show-error --location --retry 3 --compressed "${base}/$1" --output "$1"
          }
          for f in kernel.js kernel_bg.wasm kernel_client.mjs; do
            fetch "${{ steps.config.outputs.kernel }}/${f}"
          done
          for f in sysroot.tar boot.json; do
            fetch "${{ steps.config.outputs.sysroot }}/${f}"
          done
          ls -l "${{ steps.config.outputs.kernel }}" "${{ steps.config.outputs.sysroot }}"

      # Same merge as publish-clientside.yml: the sysroot describes itself,
      # the track adds its env and precompile list.
      - name: Build boot.json
        run: |
          jq -s '.[0] as $base | .[1] as $track |
            $base + {
              env: ($base.env + ($track.env // {})),
              precompile: ($track.precompile // $base.precompile)
            }' "${{ steps.config.outputs.sysroot }}/boot.json" clientside.json > boot.json

      - name: Install Playwright
        working-directory: harness
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      # For bin/build-clientside-parser.sh. Pinned, and checked, because its
      # output is part of what the published tarball's hash covers.
      - name: Install wasm-opt
        run: |
          version=130
          sha256=0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc
          curl --fail --silent --show-error --location --retry 3 --output binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz"
          echo "${sha256}  binaryen.tar.gz" | sha256sum --check --quiet
          mkdir -p "${RUNNER_TEMP}/binaryen"
          tar -xzf binaryen.tar.gz --directory "${RUNNER_TEMP}/binaryen" --strip-components=2 "binaryen-version_${version}/bin/wasm-opt"
          rm binaryen.tar.gz
          echo "${RUNNER_TEMP}/binaryen" >> "$GITHUB_PATH"

      # By the sysroot's own clang, inside the kernel: the Docker image's
      # parser is native and cannot run there.
      - name: Build exercism_parser
        env:
          HARNESS: harness
        run: |
          bin/build-clientside-parser.sh \
            "${{ steps.config.outputs.kernel }}" \
            "${{ steps.config.outputs.sysroot }}" \
            boot.json

      # The exact tarball publish-clientside.yml would ship, with the suite
      # laid on top.
      - name: Build the runner tarball
        run: |
          bin/build-clientside-tarball.sh test-runner.tar
          tar --append --file test-runner.tar --transform 's|^|opt/test-runner/|' bin/run-tests.sh tests

      - name: Run the suite in the kernel
        run: |
          node harness/run-in-kernel.mjs \
            "${{ steps.config.outputs.kernel }}" \
            "${{ steps.config.outputs.sysroot }}" \
            boot.json test-runner.tar \
            /opt/test-runner/bin/run-tests.sh
